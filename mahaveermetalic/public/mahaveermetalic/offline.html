<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d97706" />
  <title>Offline — Mahaveer Metalic</title>
  <style>
    :root { --bg: #f6f8fb; --card: #ffffff; --text: #0f172a; --sec: #64748b; --accent: #dd8613; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --card: #161c26; --text: #e6edf3; --sec: #9aa7b8; --accent: #f0a63a; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
    .card { background: var(--card); border-radius: 20px; padding: 32px 24px; max-width: 360px; width: 100%;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--sec); margin: 0 0 24px; line-height: 1.5; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 14px 24px;
      font-size: 16px; font-weight: 600; width: 100%; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="/assets/mahaveermetalic/mahaveermetalic/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Mahaveer needs the internet to show your latest orders. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
